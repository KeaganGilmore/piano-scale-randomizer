<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Piano Scale Randomizer</title>
  <meta name="description" content="A random piano scale to practice, with the notes spelled out. Tap for the next one.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f5f5f2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-title" content="Scales">
  <link rel="icon" href="icons/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
  <script>
    // Apply a saved theme before the first paint so the page never flashes the wrong colors.
    try {
      var savedTheme = localStorage.getItem('piano-scales-theme');
      if (savedTheme === 'light' || savedTheme === 'dark') document.documentElement.dataset.theme = savedTheme;
    } catch (error) {
      // Storage can be blocked (e.g. some private modes); the page then just follows the system theme.
    }
  </script>
  <script src="scales.js" defer></script>
  <script src="script.js" defer></script>
</head>
<body>
  <!-- Engraved accidentals, drawn once and reused, so sharps and flats look the same on every device. -->
  <svg class="glyphs" aria-hidden="true" focusable="false">
    <symbol id="flat" viewBox="0 0 38 100">
      <path fill-rule="evenodd" d="M2 0H9V56C14 49.5 23.5 47 30.5 51C38.5 55.5 38 67 32 74.5C25.5 82.5 14.5 91 2 100Z M9 66.5C12.5 62.5 17.5 61 21.5 62.5C25.5 64 25 69.5 21.5 74C18 78.5 13.5 83 9 87Z"/>
    </symbol>
    <symbol id="sharp" viewBox="0 0 40 100">
      <path d="M8.5 12H14.5V100H8.5Z M25.5 0H31.5V88H25.5Z M0 33L40 22V34.5L0 45.5Z M0 66.5L40 55.5V68L0 79Z"/>
    </symbol>
    <symbol id="double-sharp" viewBox="0 0 40 40">
      <path d="M0 0H12L20 8L28 0H40V12L32 20L40 28V40H28L20 32L12 40H0V28L8 20L0 12Z"/>
    </symbol>
    <symbol id="double-flat" viewBox="0 0 64 100">
      <use href="#flat" width="38" height="100"/>
      <use href="#flat" x="26" width="38" height="100"/>
    </symbol>
  </svg>

  <header class="toolbar">
    <h1 class="visually-hidden">Piano scale randomizer</h1>
    <fieldset class="filter">
      <legend class="visually-hidden">Scale type</legend>
      <div class="filter-options">
        <button type="button" class="filter-option" data-filter="all" aria-pressed="true">All</button>
        <button type="button" class="filter-option" data-filter="major" aria-pressed="false">Major</button>
        <button type="button" class="filter-option" data-filter="minor" aria-pressed="false">Minor</button>
      </div>
    </fieldset>
    <button type="button" class="theme-toggle" id="theme-toggle" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <circle cx="12" cy="12" r="8.25" fill="none" stroke="currentColor" stroke-width="1.6"/>
        <path d="M12 3.75a8.25 8.25 0 0 1 0 16.5Z" fill="currentColor"/>
      </svg>
      <span class="visually-hidden">Dark theme</span>
    </button>
  </header>

  <main class="practice">
    <div class="scale" id="scale">
      <h2 class="scale-name">
        <span class="visually-hidden" id="scale-spoken"></span>
        <span class="tonic" id="tonic" aria-hidden="true"></span>
        <span class="quality" id="quality" aria-hidden="true"></span>
        <noscript><span class="noscript">Turn on JavaScript to get a random scale.</span></noscript>
      </h2>
      <ol class="notes" id="notes" aria-label="Notes"></ol>
      <!-- The scale on the piano, for beginners. Hidden from screen readers: the notes list says the same. -->
      <div class="keyboard" id="keyboard" aria-hidden="true"></div>
    </div>

    <div class="controls">
      <button type="button" class="next" id="next">Next scale</button>
      <p class="hint">Press <kbd>Space</kbd> or <kbd>→</kbd> for the next scale</p>
    </div>

    <p class="visually-hidden" id="announcer" aria-live="polite"></p>
  </main>
</body>
</html>
