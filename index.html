<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Piano Scale Randomizer</title>
  <meta name="description" content="A random piano scale to practice, with the notes spelled out. Tap for the next one.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f5f5f2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-title" content="Scales">
  <link rel="icon" href="icons/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
  <script>
    // Apply a saved theme before the first paint so the page never flashes the wrong colors.
    try {
      var savedTheme = localStorage.getItem('piano-scales-theme');
      if (savedTheme === 'light' || savedTheme === 'dark') document.documentElement.dataset.theme = savedTheme;
    } catch (error) {
      // Storage can be blocked (e.g. some private modes); the page then just follows the system theme.
    }
  </script>
  <script src="scales.js" defer></script>
  <script src="script.js" defer></script>
</head>
<body>
  <!-- Engraved accidentals, drawn once and reused, so sharps and flats look the same on every device. -->
  <svg class="glyphs" aria-hidden="true" focusable="false">
    <symbol id="flat" viewBox="0 0 38 100">
      <path fill-rule="evenodd" d="M2 0H9V56C14 49.5 23.5 47 30.5 51C38.5 55.5 38 67 32 74.5C25.5 82.5 14.5 91 2 100Z M9 66.5C12.5 62.5 17.5 61 21.5 62.5C25.5 64 25 69.5 21.5 74C18 78.5 13.5 83 9 87Z"/>
    </symbol>
    <symbol id="sharp" viewBox="0 0 40 100">
      <path d="M8.5 12H14.5V100H8.5Z M25.5 0H31.5V88H25.5Z M0 33L40 22V34.5L0 45.5Z M0 66.5L40 55.5V68L0 79Z"/>
    </symbol>
    <symbol id="double-sharp" viewBox="0 0 40 40">
      <path d="M0 0H12L20 8L28 0H40V12L32 20L40 28V40H28L20 32L12 40H0V28L8 20L0 12Z"/>
    </symbol>
    <symbol id="double-flat" viewBox="0 0 64 100">
      <use href="#flat" width="38" height="100"/>
      <use href="#flat" x="26" width="38" height="100"/>
    </symbol>
    <!-- Treble clef and whole note from the Bravura music font (SIL Open Font License 1.1,
         github.com/steinbergmedia/bravura), in font units: 250 = one staff space, y pointing up. -->
    <defs>
      <path id="treble-clef" d="M376 415C374 427 376 428 382 434C398 449 419 470 438 491C522 583 572 702 572 815C572 902 548 988 507 1048C492 1070 466 1098 455 1098C441 1098 410 1072 390 1050C316 968 292 843 292 739C292 681 299 616 306 575C308 563 309 561 297 551C233 498 164 437 112 373C43 287 0 194 0 87C0 -87 119 -252 364 -252C387 -252 413 -250 433 -246C444 -244 446 -243 448 -255C460 -322 475 -409 475 -456C475 -604 375 -622 316 -622C262 -622 236 -606 236 -593C236 -586 245 -583 268 -576C299 -567 335 -540 335 -482C335 -427 300 -380 239 -380C172 -380 132 -433 132 -495C132 -560 171 -658 322 -658C389 -658 519 -628 519 -458C519 -401 501 -306 490 -244C488 -232 489 -233 503 -227C604 -187 671 -102 671 11C671 139 577 252 430 252C404 252 404 252 401 270ZM470 943C503 943 530 916 530 861C530 792 497 728 419 650C403 634 379 611 356 591C349 585 345 586 343 599C339 625 337 659 337 691C337 847 409 943 470 943ZM361 262C364 243 364 244 346 238C258 208 201 129 201 44C201 -46 248 -110 316 -133C324 -136 336 -139 343 -139C351 -139 355 -134 355 -128C355 -121 347 -118 340 -115C298 -97 268 -54 268 -8C268 49 307 92 368 109C384 113 386 112 388 101L438 -197C440 -208 439 -208 424 -211C408 -214 388 -216 368 -216C193 -216 80 -119 80 20C80 79 90 158 173 252C233 319 279 356 326 394C336 402 338 401 340 390ZM430 103C428 115 429 118 441 117C522 110 589 42 589 -46C589 -109 551 -160 495 -188C483 -194 481 -194 479 -182Z"/>
      <path id="whole-note" d="M216 125C83 125 0 70 0 2C0 -65 57 -125 206 -125C370 -125 422 -68 422 2C422 73 309 125 216 125ZM111 63C122 98 159 103 190 103C259 103 314 29 314 -31C314 -38 313 -44 312 -50C307 -75 293 -92 268 -98C258 -101 247 -102 237 -102C228 -102 220 -101 211 -98C194 -93 178 -84 164 -72C156 -65 149 -58 143 -50C123 -27 108 7 108 39C108 47 109 55 111 63Z"/>
    </defs>
  </svg>

  <header class="toolbar">
    <h1 class="visually-hidden">Piano scale randomizer</h1>
    <fieldset class="mode">
      <legend class="visually-hidden">Practice</legend>
      <div class="mode-options">
        <button type="button" class="mode-option" data-mode="scales" aria-pressed="true">Scales</button>
        <button type="button" class="mode-option" data-mode="chords" aria-pressed="false">Chords</button>
      </div>
    </fieldset>
    <fieldset class="filter">
      <legend class="visually-hidden">Major or minor</legend>
      <div class="filter-options">
        <button type="button" class="filter-option" data-filter="all" aria-pressed="true">All</button>
        <button type="button" class="filter-option" data-filter="major" aria-pressed="false">Major</button>
        <button type="button" class="filter-option" data-filter="minor" aria-pressed="false">Minor</button>
      </div>
    </fieldset>
    <button type="button" class="theme-toggle" id="theme-toggle" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <circle cx="12" cy="12" r="8.25" fill="none" stroke="currentColor" stroke-width="1.6"/>
        <path d="M12 3.75a8.25 8.25 0 0 1 0 16.5Z" fill="currentColor"/>
      </svg>
      <span class="visually-hidden">Dark theme</span>
    </button>
  </header>

  <main class="practice">
    <div class="scale" id="scale">
      <h2 class="scale-name">
        <span class="visually-hidden" id="scale-spoken"></span>
        <span class="tonic" id="tonic" aria-hidden="true"></span>
        <span class="quality" id="quality" aria-hidden="true"></span>
        <noscript><span class="noscript">Turn on JavaScript to get a random scale.</span></noscript>
      </h2>
      <ol class="notes" id="notes" aria-label="Notes"></ol>
      <!-- The scale on the piano and on the staff. Hidden from screen readers: the notes list says the same. -->
      <div class="diagrams" aria-hidden="true">
        <div class="keyboard" id="keyboard"></div>
        <svg class="staff" id="staff" focusable="false"></svg>
      </div>
    </div>

    <div class="controls">
      <button type="button" class="next" id="next">Next scale</button>
      <p class="hint">Press <kbd>Space</kbd> or <kbd>→</kbd> for the next <span id="hint-noun">scale</span></p>
    </div>

    <p class="visually-hidden" id="announcer" aria-live="polite"></p>
  </main>

  <footer class="credit">
    <a href="https://coreaxisdev.com" target="_blank" rel="noopener">
      <img src="icons/core_axis.svg" alt="" width="14" height="16">
      <span>Built by Core Axis Development (Pty) Ltd</span>
      <span class="visually-hidden">(opens in a new tab)</span>
    </a>
  </footer>
</body>
</html>
